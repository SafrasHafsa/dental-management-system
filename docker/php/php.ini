; Performance
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0

; Upload limits
upload_max_filesize=20M
post_max_size=20M
max_execution_time=120
memory_limit=256M

; Error reporting (dev)
display_errors=On
error_reporting=E_ALL
log_errors=On
