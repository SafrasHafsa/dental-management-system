version: '3.8'

services:

  # ─── PHP Application ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dental_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    networks:
      - dental_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Web Server ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: dental_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dental_network
    depends_on:
      - app

  # ─── Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: dental_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: dental_db
      MYSQL_USER: dental_user
      MYSQL_PASSWORD: dental_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dental_network

  # ─── Cache & Queue ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: dental_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dental_network

  # ─── Queue Worker ──────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dental_queue
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    networks:
      - dental_network
    depends_on:
      - app
      - redis

  # ─── DB Admin UI (dev) ─────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dental_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: dental_user
      PMA_PASSWORD: dental_pass
    networks:
      - dental_network
    depends_on:
      - mysql

  # ─── Mail Catcher (dev) ────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: dental_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - dental_network

networks:
  dental_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
